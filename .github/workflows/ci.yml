name: Swift package build and tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-macos:
    name: Swift package - macOS 15
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Compile all library targets
        run: swift build
      - name: Offline regression suite (no live-network dependency)
        run: |
          swift test --parallel --enable-code-coverage \
            --filter 'ConnectivityBuilderTests|DiagnosticEngineTests|IntegrationTests|NetworkObserverTests|NetworkStateTests|StrictPortalValidationTests'
      - name: Xcode iOS Simulator target compilation
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -n 30

  live-network-smoke:
    name: Optional live network probes
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Live endpoints (network and firewall-dependent)
        run: swift test --filter LiveNetworkReachabilityTests
